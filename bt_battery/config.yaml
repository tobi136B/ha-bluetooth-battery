name: Bluetooth Battery
version: "0.4.1"
slug: bt_battery
description: Read the battery level of Bluetooth devices (headphones, headsets, BLE) directly on HA OS
url: https://github.com/tobi136B/ha-bluetooth-battery
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: services
# Zugriff auf BlueZ des Hostsystems über D-Bus
host_dbus: true
services:
  - mqtt:need
options:
  adapter: hci0
  devices: []
  poll_interval_minutes: 15
  hold_seconds: 20
  disconnect_after_read: true
  log_level: info
  scan_on_start: true
  scan_seconds: 30
  monitor_all_paired: false
schema:
  adapter: match(^hci[0-9]+$)
  devices:
    - mac: match(^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$)
      name: str
  poll_interval_minutes: int(1,1440)
  hold_seconds: int(5,120)
  disconnect_after_read: bool
  log_level: list(debug|info|warning)
  scan_on_start: bool
  scan_seconds: int(5,120)
  monitor_all_paired: bool
