configuration:
  adapter:
    name: Bluetooth Adapter
    description: z.B. hci0 (eingebaut) oder hci1 (USB Dongle). Siehe Einstellungen > System > Hardware.
  devices:
    name: Geräte (optional)
    description: Normalerweise leer lassen. Geräte stattdessen in Home Assistant mit dem Schalter "Monitor battery" auswählen. Hier eingetragene Geräte werden immer überwacht.
  poll_interval_minutes:
    name: Abfrageintervall (Minuten)
    description: Wie oft nicht verbundene Geräte kurz angefragt werden.
  hold_seconds:
    name: Wartezeit auf Akkumeldung (Sekunden)
    description: So lange bleibt die Verbindung offen, bis eine Akkumeldung kommt.
  disconnect_after_read:
    name: Nach dem Lesen trennen
    description: Gibt den Verbindungsplatz am Kopfhörer wieder frei (empfohlen bei Multipoint).
  scan_on_start:
    name: Beim Start nach Geräten suchen
    description: Listet alle Geräte in der Nähe mit MAC Adresse im Protokoll und im Sensor "Found devices".
  scan_seconds:
    name: Suchdauer (Sekunden)
  monitor_all_paired:
    name: Alle gekoppelten Geräte überwachen
    description: Überwacht automatisch jedes am Adapter gekoppelte Gerät, ohne MAC Eingabe.
  log_level:
    name: Protokollstufe
