configuration:
  adapter:
    name: Bluetooth adapter
    description: e.g. hci0 (built in) or hci1 (USB dongle).
  devices:
    name: Devices
    description: Bluetooth devices with MAC address and display name.
  poll_interval_minutes:
    name: Poll interval (minutes)
  hold_seconds:
    name: Wait for battery report (seconds)
  disconnect_after_read:
    name: Disconnect after reading
  scan_on_start:
    name: Scan for devices on start
    description: Lists all nearby devices with MAC address in the log and in the "Found devices" sensor.
  scan_seconds:
    name: Scan duration (seconds)
  monitor_all_paired:
    name: Monitor all paired devices
    description: Automatically monitors every device paired with the adapter, no MAC needed.
  log_level:
    name: Log level
